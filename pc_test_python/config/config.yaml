system:
  device_id: "pc_test_station"
  log_level: "INFO"
  headless: true # Show window on PC

cameras:
  - id: "webcam"
    url: "0" # Integer 0 for default webcam
    name: "PC_Webcam"
    enabled: true

motion_detection:
  enabled: true
  threshold: 25
  min_area: 500

inference:
  # For PC testing, we can use standard YOLOv8 models (.pt)
  # Ultralytics will auto-download 'yolov8n.pt' if missing.
  # To test PPE specifically, download a PPE model (e.g. from Roboflow/HuggingFace)
  # and change this path to "models/yolov8n-ppe.pt"
  # model_path: "yolov8n.pt"
  model_path: "models/p4_ppe.onnx" # Custom PPE model with 17 classes

  network_name: "yolov8n"
  input_shape: [640, 640]
  score_threshold: 0.5
  iou_threshold: 0.45
  max_boxes: 100

  # Class names for the p4_ppe.pt model (17 classes)
  class_names:
    [
      "person",
      "ear",
      "ear-mufs",
      "face",
      "face-guard",
      "face-mask",
      "foot",
      "tool",
      "glasses",
      "gloves",
      "helmet",
      "hands",
      "head",
      "medical-suit",
      "shoes",
      "safety-suit",
      "safety-vest",
    ]

collection:
  strategy: "interval"
  interval_seconds: 2.0
  save_images: true
  save_labels: true

  # Target classes to collect data for from the p4_ppe.pt model
  target_classes:
    [
      "person",
      "helmet",
      "safety-vest",
      "ear-mufs",
      "face-guard",
      "face-mask",
      "glasses",
      "gloves",
      "medical-suit",
      "safety-suit",
    ]

  min_confidence: 0.6

storage:
  base_path: "dataset_pc_test"
  images_dir: "images"
  labels_dir: "labels"
  database_path: "datacollector_test.db"
  train_split: 0.8
