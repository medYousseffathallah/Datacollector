system:
  device_id: "jetson_nano_ppe_01"
  log_level: "INFO"
  headless: true

cameras:
  - id: "cam_01"
    url: "admin:dmin@192.168.1.17:8081/live"
    name: "Webcam"
    enabled: true
  # - id: "cam_02"
  #   url: "rtsp://admin:password@192.168.1.102:554/stream1"
  #   name: "Warehouse"
  #   enabled: true

motion_detection:
  enabled: true
  threshold: 25
  min_area: 500

inference:
  model_path: "models/ppe_best.pt"
  input_shape: [640, 640]
  score_threshold: 0.5
  iou_threshold: 0.45
  max_boxes: 100
  auto_export_engine: true
  export_half: true
  export_device: 0
  force_mock: false
  # class_names: [] # Commented out to auto-load from model
  # class_names:
  #   [
  #     "Hardhat",
  #     "Mask",
  #     "NO-Hardhat",
  #     "NO-Mask",
  #     "NO-Safety Vest",
  #     "Person",
  #     "Safety Cone",
  #     "Safety Vest",
  #     "machinery",
  #     "vehicle",
  #   ]

detection:
  min_confidence: 0.6
  process_interval_seconds: 0.0
  trigger_classes: ["NO-Hardhat", "NO-Mask", "NO-Safety Vest"]
  require_person: true
  person_class_name: "Person"
  per_person: true
  pre_seconds: 15.0
  post_seconds: 15.0
  clip_fps: 15.0
  output_dir: "events"
  crop_padding: 10
  cooldown_seconds: 5.0
  timestamp_format: "%Y%m%d_%H%M%S_%f"
  fourcc: "mp4v"
  time_windows: []
